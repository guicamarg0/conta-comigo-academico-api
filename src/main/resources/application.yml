spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: gestao-servicos-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
app:
  cors:
    origensPermitidas: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    segredo: ${JWT_SECRET}
    minutosExpiracao: ${JWT_EXPIRATION_MINUTES:60}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
