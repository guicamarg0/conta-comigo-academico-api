name: conta-comigo-academico
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conta_comigo_academico}
      POSTGRES_USER: ${DB_USER:?Copie .env.example para .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copie .env.example para .env}
    volumes:
      - dados-academicos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: academico
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-conta_comigo_academico}
      DB_USER: ${DB_USER:?Copie .env.example para .env}
      DB_PASSWORD: ${DB_PASSWORD:?Copie .env.example para .env}
      JWT_SECRET: ${JWT_SECRET:?Copie .env.example para .env}
      ADMIN_GERAL_EMAIL: ${ADMIN_GERAL_EMAIL:?Defina o administrador local}
      ADMIN_GERAL_SENHA: ${ADMIN_GERAL_SENHA:?Defina a senha local}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${FRONTEND_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_REMETENTE: ${EMAIL_REMETENTE:-}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 15
  web:
    build: ../conta-comigo-academico-web
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  dados-academicos:
